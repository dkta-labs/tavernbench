when:
  - event: pull_request
  - event: push
    branch: main

labels:
  location: daimon

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.9.2@sha256:a36586dfe77e9c5d9b5bff3ad37f18158eb12036aa9e9908e2e813ee6029573e
    settings:
      partial: false
      depth: 50

steps:
  - name: behavior-lab-contract
    image: docker.io/library/python:3.12-slim@sha256:dd29372629eeba2dd003fd9e9d35a5b8236c44727875a0364254b5127af88e65
    commands:
      - PYTHONPATH=sdk python -m unittest discover -s tests -v
      - python -m pip install './sdk[mcp]'
      - tavernbench --help
      - python mcp/server.py </dev/null
      - bash -n install.sh
