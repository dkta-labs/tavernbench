[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tavernbench"
version = "0.2.0"
description = "TavernBench Behavior Lab HTTP SDK for replayable synthetic agent traces"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

# Runtime core uses the Python standard library HTTP client.
dependencies = []

[project.optional-dependencies]
# Used by install.sh --mcp for the cloned-repository stdio server.
mcp = [
    "mcp[cli]>=1.0,<2",
]

[project.scripts]
tavernbench = "tavernbench.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["tavernbench"]

[tool.hatch.build.targets.sdist]
exclude = [
    "dist/",
    "__pycache__/",
    "*.pyc",
]
